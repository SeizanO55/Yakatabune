<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>屋形船 席決め航海図 / Seat Voyage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy-deep:#0d2436;
  --navy:#15334a;
  --navy-light:#1f4a63;
  --gold:#c9a227;
  --gold-bright:#e8c860;
  --vermillion:#c1442e;
  --paper:#f3ecdb;
  --paper-dim:#d9cfae;
  --teal:#2f6f6b;
  --ink:#1a1a1a;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:
    radial-gradient(ellipse at 20% -10%, rgba(232,200,96,.08), transparent 45%),
    radial-gradient(ellipse at 90% 110%, rgba(47,111,107,.15), transparent 50%),
    var(--navy-deep);
  color:var(--paper);
  font-family:"Zen Kaku Gothic New", sans-serif;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.seigaiha{
  height:14px;
  width:100%;
  background-image: radial-gradient(circle at 50% -50%, transparent 60%, var(--gold) 61%, var(--gold) 63%, transparent 64%);
  background-size: 28px 28px;
  background-position: 0 0, 14px 0;
  opacity:.35;
}
h1,h2,h3,.disp{font-family:"Shippori Mincho", serif; letter-spacing:.02em;}
.eyebrow{
  font-size:12px; letter-spacing:.2em; color:var(--gold-bright); text-transform:uppercase;
  font-family:"Zen Kaku Gothic New",sans-serif; font-weight:700;
}
.wrap{max-width:760px; margin:0 auto; padding:56px 18px 80px;}
.card{
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
  border:1px solid rgba(232,200,96,.18);
  border-radius:14px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:18px;
}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  background:var(--gold);
  color:var(--navy-deep);
  border:none;
  padding:14px 22px;
  font-size:16px;
  font-weight:700;
  border-radius:10px;
  cursor:pointer;
  font-family:"Zen Kaku Gothic New",sans-serif;
  transition:transform .12s ease, box-shadow .12s ease, background .12s ease;
  box-shadow:0 4px 0 #8a7113;
  text-decoration:none;
}
.btn:hover{background:var(--gold-bright);}
.btn:active{transform:translateY(3px); box-shadow:0 1px 0 #8a7113;}
.btn.secondary{
  background:transparent; color:var(--paper); border:1px solid rgba(243,236,219,.35);
  box-shadow:none;
}
.btn.secondary:active{transform:translateY(1px);}
.btn.danger{background:var(--vermillion); color:var(--paper); box-shadow:0 4px 0 #7c2a1c;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
input[type=text], input[type=password], select{
  width:100%;
  padding:13px 14px;
  border-radius:10px;
  border:1px solid rgba(243,236,219,.3);
  background:rgba(255,255,255,.06);
  color:var(--paper);
  font-size:16px;
  font-family:"Zen Kaku Gothic New",sans-serif;
}
input::placeholder{color:rgba(243,236,219,.4);}
.option-btn{
  display:block; width:100%; text-align:left;
  padding:16px 16px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid rgba(243,236,219,.2);
  background:rgba(255,255,255,.03);
  color:var(--paper);
  font-size:15.5px;
  cursor:pointer;
  transition:all .15s ease;
  font-family:"Zen Kaku Gothic New",sans-serif;
}
.option-btn:hover{border-color:var(--gold); background:rgba(201,162,39,.1);}
.option-btn.selected{border-color:var(--gold-bright); background:rgba(201,162,39,.22); box-shadow:0 0 0 1px var(--gold-bright) inset;}
.progress-track{height:6px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; margin-bottom:20px;}
.progress-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--gold)); transition:width .3s ease;}
.qnum{color:var(--gold-bright); font-weight:700; font-size:13px; letter-spacing:.1em;}
.pill{
  display:inline-block; padding:4px 12px; border-radius:99px; font-size:12.5px; font-weight:700;
  background:rgba(201,162,39,.18); color:var(--gold-bright); border:1px solid rgba(201,162,39,.4);
}
a{color:var(--gold-bright);}
.center{text-align:center;}
.muted{color:rgba(243,236,219,.6); font-size:14px; line-height:1.7;}

.board-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:16px;
}
.lantern{
  position:relative;
  background:radial-gradient(circle at 50% 20%, rgba(232,200,96,.15), rgba(21,51,74,.9) 70%);
  border:1px solid rgba(232,200,96,.35);
  border-radius:16px;
  padding:18px 16px 16px;
  min-height:150px;
  box-shadow:0 0 26px rgba(201,162,39,.08), var(--shadow);
}
.lantern::before{
  content:""; position:absolute; top:-8px; left:50%; transform:translateX(-50%);
  width:26px; height:8px; background:var(--gold); border-radius:4px 4px 0 0;
}
.lantern h3{margin:0 0 1px; font-size:19px; color:var(--gold-bright);}
.lantern .concept-en{font-size:12.5px; color:rgba(232,200,96,.75); font-weight:700; margin-bottom:2px;}
.lantern .concept{font-size:12px; color:rgba(243,236,219,.5); margin-bottom:10px;}
.lantern .members{font-size:14px; line-height:1.9;}
.lantern .members .m{display:inline-block; margin:2px 6px 2px 0; padding:3px 9px; background:rgba(255,255,255,.06); border-radius:99px;}
.lantern .members .m.meister{background:var(--vermillion); color:#fff; font-weight:700;}
.lantern .count{position:absolute; top:12px; right:14px; font-size:12px; color:rgba(243,236,219,.5);}

.axis-row{margin-bottom:16px;}
.axis-label{display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; color:rgba(243,236,219,.75);}
.axis-bar{height:10px; border-radius:99px; background:rgba(255,255,255,.08); overflow:hidden; position:relative;}
.axis-fill{height:100%; background:linear-gradient(90deg,var(--teal),var(--gold-bright)); border-radius:99px;}

.badge-meister{
  display:inline-flex; align-items:center; gap:8px;
  background:var(--vermillion); color:#fff; padding:10px 16px; border-radius:10px; font-weight:700;
  margin-top:8px;
}
.note-box{
  background:rgba(47,111,107,.18); border:1px solid rgba(47,111,107,.5); border-radius:10px;
  padding:12px 14px; font-size:13.5px; color:var(--paper); margin-top:10px; line-height:1.7;
}

table.score-table{width:100%; border-collapse:collapse; font-size:14px;}
table.score-table th, table.score-table td{padding:9px 8px; text-align:left; border-bottom:1px solid rgba(243,236,219,.12);}
table.score-table th{color:var(--gold-bright); font-weight:700; font-size:12px; letter-spacing:.05em;}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--navy-light); border:1px solid var(--gold); color:var(--paper);
  padding:12px 20px; border-radius:10px; box-shadow:var(--shadow); z-index:999; font-size:14px;
}
.header-top{display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;}
.small-link{font-size:12px; color:rgba(243,236,219,.45); text-decoration:none;}
.opinion-scale{display:flex; gap:8px;}
.opinion-scale button{flex:1; padding:12px 4px; border-radius:8px; border:1px solid rgba(243,236,219,.25); background:rgba(255,255,255,.03); color:var(--paper); cursor:pointer; font-size:12.5px;}
.opinion-scale button.selected{background:var(--gold); color:var(--navy-deep); font-weight:700; border-color:var(--gold);}
hr.divider{border:none; border-top:1px dashed rgba(243,236,219,.2); margin:18px 0;}
.spinner{width:22px;height:22px;border:3px solid rgba(255,255,255,.2); border-top-color:var(--gold); border-radius:50%; animation:spin 1s linear infinite; display:inline-block;}
@keyframes spin{to{transform:rotate(360deg);}}
.waiting-dot{display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--gold-bright); animation:pulse 1.4s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:.3;}50%{opacity:1;}}

/* 座席ボード演出：新規参加・マイスター交代のハイライト */
.lantern-pulse{ animation: lanternPulse 1.8s ease-out 2; }
@keyframes lanternPulse{
  0%{ box-shadow:0 0 0 rgba(232,200,96,0); transform:scale(1); }
  30%{ box-shadow:0 0 40px rgba(232,200,96,.9); transform:scale(1.035); }
  100%{ box-shadow:0 0 26px rgba(201,162,39,.08); transform:scale(1); }
}
.lantern-flash{ animation: lanternFlash 1.6s ease-out 2; }
@keyframes lanternFlash{
  0%{ border-color:var(--vermillion); box-shadow:0 0 0 rgba(193,68,46,0); }
  30%{ border-color:var(--vermillion); box-shadow:0 0 34px rgba(193,68,46,.8); }
  100%{ border-color:rgba(232,200,96,.35); box-shadow:0 0 26px rgba(201,162,39,.08); }
}
#spotlightZone{ min-height:0; margin-bottom:6px; }
.spotlight-card{
  background:linear-gradient(90deg, rgba(232,200,96,.18), rgba(47,111,107,.18));
  border:1px solid var(--gold-bright);
  border-radius:12px; padding:12px 16px; margin-bottom:8px;
  font-size:15px; font-weight:700; color:var(--paper);
}
.spotlight-card.meister-change{ border-color:var(--vermillion); background:linear-gradient(90deg, rgba(193,68,46,.22), rgba(232,200,96,.12)); }
.spotlight-anim{ animation: spotlightIn .5s ease-out; }
@keyframes spotlightIn{ from{ opacity:0; transform:translateY(-10px);} to{ opacity:1; transform:translateY(0);} }

/* 結果発表画面 */
.rank-row{
  display:flex; align-items:center; gap:14px;
  background:rgba(255,255,255,.04); border:1px solid rgba(232,200,96,.2);
  border-radius:12px; padding:16px 18px; margin-bottom:12px;
  animation: rankIn .5s ease-out backwards;
}
.rank-row.first{ border-color:var(--gold-bright); background:linear-gradient(90deg, rgba(232,200,96,.25), rgba(255,255,255,.03)); box-shadow:0 0 30px rgba(232,200,96,.25); }
@keyframes rankIn{ from{ opacity:0; transform:translateX(-16px);} to{ opacity:1; transform:translateX(0);} }
.rank-medal{ font-size:26px; width:42px; text-align:center; flex-shrink:0; }
.rank-name{ flex:1; font-size:17px; font-weight:700; }
.rank-score{ font-size:20px; font-weight:800; color:var(--gold-bright); }
.hero-title{ text-align:center; padding:20px 0; }
.hero-title .disp{ font-size:32px; margin:0; }
.closed-box{
  text-align:center; padding:60px 24px; border:2px dashed rgba(232,200,96,.3); border-radius:16px;
}

/* コントロールバー（言語切替＋サウンド切替）- 常に右上に表示 */
#controlsBar{
  position:fixed; top:14px; right:14px; z-index:1000;
  display:flex; align-items:center; gap:8px;
}
#backBtn{
  position:fixed; top:14px; left:14px; z-index:1000;
  background:rgba(13,36,54,.85); border:1px solid rgba(232,200,96,.4); color:var(--paper);
  border-radius:99px; padding:8px 14px 8px 12px; font-size:13px; font-weight:700; cursor:pointer;
  backdrop-filter:blur(4px); font-family:"Zen Kaku Gothic New",sans-serif;
  display:flex; align-items:center; gap:4px;
}
#backBtn:hover{ border-color:var(--gold-bright); color:var(--gold-bright); }
#langToggle{
  display:flex; background:rgba(13,36,54,.85); border:1px solid rgba(232,200,96,.4);
  border-radius:99px; padding:3px; backdrop-filter:blur(4px);
}
#langToggle button{
  border:none; background:transparent; color:rgba(243,236,219,.6); font-size:12px; font-weight:700;
  padding:6px 12px; border-radius:99px; cursor:pointer; font-family:"Zen Kaku Gothic New",sans-serif;
}
#langToggle button.active{background:var(--gold); color:var(--navy-deep);}
#soundToggle{
  background:rgba(13,36,54,.85); border:1px solid rgba(232,200,96,.4); color:rgba(243,236,219,.8);
  border-radius:99px; width:34px; height:34px; font-size:15px; cursor:pointer; backdrop-filter:blur(4px);
}
#soundToggle.on{ background:var(--gold); color:var(--navy-deep); border-color:var(--gold); }
.bi-en{color:rgba(243,236,219,.55); font-size:.82em; display:block; margin-top:2px; font-weight:400;}

/* レトロゲーム風のドット装飾（特定キャラクターに依らないオリジナル演出） */
.pixel-frame{
  position:relative;
  border:3px solid var(--gold-bright);
  box-shadow:
    0 0 0 3px var(--navy-deep),
    0 0 0 6px var(--gold-bright),
    0 0 24px rgba(232,200,96,.35);
  image-rendering:pixelated;
}
.pixel-sparkle{ display:inline-block; animation: sparkleSpin 1.8s linear infinite; }
@keyframes sparkleSpin{ 0%,100%{ transform:scale(1) rotate(0deg);} 50%{ transform:scale(1.25) rotate(15deg);} }
.retro-badge{
  display:inline-flex; align-items:center; gap:6px;
  font-family:"Zen Kaku Gothic New",sans-serif; font-size:11px; font-weight:900; letter-spacing:.1em;
  background:var(--navy-deep); color:var(--gold-bright); border:2px solid var(--gold-bright);
  padding:4px 10px; border-radius:4px;
}
@keyframes coinBlink{ 0%,100%{ opacity:1;} 50%{ opacity:.4;} }
.coin-blink{ animation: coinBlink 1s steps(2) infinite; }

/* ドット絵アイコンバッジ */
.pixel-icon-badge{
  display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle, rgba(232,200,96,.22), rgba(21,51,74,.4) 70%);
  border:1px solid rgba(232,200,96,.4);
  border-radius:10px;
  margin:0 auto;
}
.pixel-icon-svg{ image-rendering:pixelated; shape-rendering:crispEdges; color:var(--gold-bright); }
.pixel-icon-svg rect{ fill:currentColor; }
.lantern .pixel-icon-badge{ margin:0 0 6px; }
.lantern.lantern-pulse .pixel-icon-svg{ animation: iconBounce 1.8s ease-out 2; }
@keyframes iconBounce{ 0%,100%{ transform:translateY(0);} 30%{ transform:translateY(-4px) scale(1.15);} }

/* 浮世絵風イラスト */
.hero-art{
  width:100%; max-width:420px; display:block; margin:0 auto 18px;
  border-radius:14px; box-shadow:var(--shadow); border:1px solid rgba(232,200,96,.3);
}
.sakura-corner{ position:absolute; top:-6px; right:-6px; pointer-events:none; opacity:.9; }
.card{ position:relative; }
</style>
</head>

/* 補足：この apiKey は「クライアントコードに埋め込まれる前提の公開値」で、
   Firebase自体がそのように設計しています（サーバー用の秘密鍵とは別物です）。
   実際のデータ保護は Realtime Database のセキュリティルール（期限付き）が

/* =========================================================================
   2) 管理者パスワード / Admin passwords（複数名で共有可）
   このファイルはGitHub Pagesなど静的サイトとして公開されるため、
   平文でパスワードを書くとブラウザの「ページのソースを表示」で
   誰でも読めてしまいます。そのため、パスワードそのものではなく
   SHA-256ハッシュ値を保存し、入力値をハッシュ化してから比較しています。
   （ソースを見ても元のパスワードは分からなくなりますが、辞書攻撃や
   総当たりへの耐性はパスワードの強度に依存するため、他で使い回して
   いない、ある程度推測しにくいパスワードにしてください。）

   パスワードを変更・追加したい場合は、以下のいずれかの方法でSHA-256の
   16進数ハッシュ値を計算し、下の配列に追加/置き換えてください。
   ・ブラウザのコンソールで: 
     crypto.subtle.digest("SHA-256", new TextEncoder().encode("新しいパスワード"))
       .then(b=>console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")))
   ・またはこのファイルの管理者にハッシュ化を依頼してください。
   ========================================================================= */
const ADMIN_PASSWORD_HASHES = [
  "98fadf7eb6b26de734cc27761301afefa0e3602e013946d1a706d27a33bf33ed", // funayakata2026
  "e0e3a28c64bc36f718c8c16717aafc54b3ba63642ade0b5d2fd34eececef822b", // kanjiA
  "dcc51bc5dead2edf5977c478e7769e140a4a5498b5061b4a832233f7768e90c4", // kanjiB

async function sha256Hex(text){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
  return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,"0")).join("");

/* =========================================================================
   オリジナルのドット絵アイコン（8x8グリッド）
   特定のゲームキャラクターを模写せず、剣・盾・UFOなど汎用的なモチーフを
   ジャンルのイメージに合わせて各テーマに割り当てています。著作権の
   心配なく「レトロゲームらしさ」を視覚的に演出するための独自素材です。
   ========================================================================= */
const PIXEL_ICONS = {
  star:      ["...XX...",".XXXXXX.","XXXXXXXX",".XXXXXX.","..XXXX..",".X....X.","X......X","........"],
  block:     ["........","..XXXX..","..X..X..","..X..X..","..XXXX..","XXXX....","X..X....","XXXX...."],
  sword:     ["...XX...","...XX...","...XX...","...XX...",".XXXXXX.","...XX...","...XX...","..XXXX.."],
  shield:    [".XXXXXX.","XXXXXXXX","XXXXXXXX","XXXXXXXX",".XXXXXX.","..XXXX..","...XX...","...XX..."],
  ghost:     ["..XXXX..",".XXXXXX.","XXXXXXXX","XXXXXXXX","XXXXXXXX","XXXXXXXX","X.X.X.X.","X.X.X.X."],
  gem:       ["...XX...","..XXXX..",".XXXXXX.","XXXXXXXX",".XXXXXX.","..XXXX..","...XX...","........"],
  fist:      ["........","..X..X..",".XXXXXX.","XXXXXXXX","XXXXXXXX","XXXXXXXX","..XXXX..","..XXXX.."],
  ufo:       ["........","...XX...","..XXXX..",".XXXXXX.","XXXXXXXX","X.X..X.X","........","........"],
  barrel:    [".XXXXXX.","X.XXXX.X","XXXXXXXX","X.XXXX.X","XXXXXXXX","X.XXXX.X","XXXXXXXX",".XXXXXX."],
  bomb:      ["....XX..","...X....","..XXXX..",".XXXXXX.","XXXXXXXX","XXXXXXXX","XXXXXXXX",".XXXXXX."],
  lightning: ["....XX..","...XX...","..XX....",".XXXXXX.","..XX....","...XX...","..XX....",".XX....."],
  pickaxe:   ["XX......","XXX.....",".XXX....","..XXX...","...XXX..","....XXX.","..XXX...","..XXX..."],
};
function pixelIconSVG(key, sizePx){
  const grid = PIXEL_ICONS[key] || PIXEL_ICONS.star;
  const n = grid.length;
  let rects = "";
  grid.forEach((row,y)=>{
    for(let x=0;x<row.length;x++){
      if(row[x]==="X"){ rects += `<rect x="${x}" y="${y}" width="1" height="1"/>`; }
    }
  });
  return `<svg viewBox="0 0 ${n} ${n}" width="${sizePx||32}" height="${sizePx||32}" class="pixel-icon-svg" preserveAspectRatio="xMidYMid meet">${rects}</svg>`;
}
function themeIconBadge(theme, sizePx){
  return `<div class="pixel-icon-badge" style="width:${(sizePx||32)+16}px;height:${(sizePx||32)+16}px;">${pixelIconSVG(theme.icon, sizePx)}</div>`;
}

/* =========================================================================
   オリジナル8bit風効果音（Web Audio APIでその場で生成。特定楽曲の複製ではありません）
   ブラウザの自動再生制限により、ページ内で一度ボタンをクリックするまでは
   音が鳴らないため、右上の🔇ボタンで明示的にON/OFFできるようにしています。
   ========================================================================= */
let soundEnabled = sessionStorage.getItem("fnk_sound")==="1";
let audioCtx = null;
function ensureAudioCtx(){
  if(!audioCtx){
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(Ctx) audioCtx = new Ctx();
  }
  return audioCtx;
}
function playTone(freq, startOffset, duration, type, gainVal){
  if(!soundEnabled) return;
  try{
    const ctx = ensureAudioCtx();
    if(!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type || "square";
    osc.frequency.value = freq;
    const t0 = ctx.currentTime + (startOffset||0);
    gain.gain.setValueAtTime(gainVal||0.05, t0);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + (duration||0.15));
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(t0); osc.stop(t0 + (duration||0.15) + 0.02);
  }catch(e){ /* audio not available; fail silently */ }
}
function playJoinChime(){ playTone(880,0,0.1,"square",0.05); playTone(1318.5,0.09,0.14,"square",0.05); }
function playMeisterChime(){ playTone(659.25,0,0.09,"triangle",0.06); playTone(783.99,0.08,0.09,"triangle",0.06); playTone(987.77,0.16,0.2,"triangle",0.06); }
function playCorrectChime(){ playTone(1046.5,0,0.08,"square",0.045); playTone(1567.98,0.07,0.12,"square",0.045); }
function playFanfare(){ [523.25,659.25,783.99,1046.5,1318.51].forEach((f,i)=>playTone(f, i*0.13, 0.22, "square", 0.055)); }

function applySoundButton(){
  const btn = document.getElementById("soundToggle");
  if(!btn) return;
  btn.textContent = soundEnabled ? "🔊" : "🔇";
  btn.classList.toggle("on", soundEnabled);
}
document.getElementById("soundToggle").addEventListener("click", ()=>{
  soundEnabled = !soundEnabled;
  sessionStorage.setItem("fnk_sound", soundEnabled ? "1" : "0");
  if(soundEnabled){ const ctx = ensureAudioCtx(); if(ctx && ctx.state==="suspended") ctx.resume(); playJoinChime(); }
  applySoundButton();
});
applySoundButton();

let USE_FIREBASE = firebaseConfig.apiKey && firebaseConfig.apiKey !== "YOUR_API_KEY";
let db;
if (USE_FIREBASE) {
  const fb = initializeApp(firebaseConfig);
  db = getDatabase(fb);
}

const LOCAL_KEY = "funanoseki_mock_db_v1";
function readLocal(){ try{ return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; }catch(e){ return {}; } }
function writeLocal(obj){ localStorage.setItem(LOCAL_KEY, JSON.stringify(obj)); bc.postMessage("update"); }
const bc = new BroadcastChannel("funanoseki_mock_db_v1_channel");
function getAtPath(obj, path){ return path.split("/").filter(Boolean).reduce((o,k)=> (o&&o[k]!==undefined)?o[k]:undefined, obj); }
function setAtPath(obj, path, value){
  const parts = path.split("/").filter(Boolean);
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){ if(!cur[parts[i]]) cur[parts[i]]={}; cur = cur[parts[i]]; }
  if(parts.length===0){ return value; }
  cur[parts[parts.length-1]] = value;
  return obj;
}

const DB = {
  async set(path, value){
    if(USE_FIREBASE){ return set(ref(db,path), value); }
    const data = readLocal(); setAtPath(data, path, value); writeLocal(data);
  },
  async update(path, value){
    if(USE_FIREBASE){ return update(ref(db,path), value); }
    const data = readLocal();
    const existing = getAtPath(data, path) || {};
    setAtPath(data, path, Object.assign({}, existing, value)); writeLocal(data);
  },
  async push(path, value){
    if(USE_FIREBASE){ const r = push(ref(db,path)); await set(r, value); return r.key; }
    const data = readLocal();
    const key = "k"+Date.now()+Math.random().toString(36).slice(2,7);
    const existing = getAtPath(data, path) || {};
    existing[key] = value;
    setAtPath(data, path, existing); writeLocal(data);
    return key;
  },
  async get(path){
    if(USE_FIREBASE){ const s = await get(ref(db,path)); return s.exists()? s.val(): null; }
    const data = readLocal(); return getAtPath(data, path) ?? null;
  },
  async remove(path){
    if(USE_FIREBASE){ return remove(ref(db,path)); }
    const data = readLocal(); setAtPath(data, path, null); writeLocal(data);
  },
  onValue(path, cb){
    if(USE_FIREBASE){
      const r = ref(db, path);
      const unsub = onValue(r, (snap)=> cb(snap.exists()? snap.val(): null));
      return unsub;
    }
    const handler = ()=> cb(getAtPath(readLocal(), path) ?? null);
    handler();
    bc.addEventListener("message", handler);
    window.addEventListener("storage", handler);
    return ()=>{ bc.removeEventListener("message", handler); window.removeEventListener("storage", handler); };
  }
};

function esc(s){ return (s+"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function toast(msg){
  const t = document.createElement("div"); t.className="toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2600);
}
function clampTableCount(n){ return Math.max(MIN_TABLE_COUNT, Math.min(MAX_TABLE_COUNT, n||DEFAULT_TABLE_COUNT)); }
function getActiveThemes(cfg){
  const n = clampTableCount(cfg && cfg.tableCount);
  return GAME_THEMES.slice(0, n);
}
function getCapacity(cfg){
  return (cfg && cfg.capacityPerTable) || DEFAULT_CAPACITY;
}

    await DB.set("event/config", {

      tableQuiz: DEFAULT_TABLE_QUIZ,
      roster: [],
      tableCount: DEFAULT_TABLE_COUNT,
      capacityPerTable: DEFAULT_CAPACITY
    });
  }
  const cfg = await DB.get("event/config");
  const themes = getActiveThemes(cfg);
  const tablesExisting = await DB.get("tables");
  if(!tablesExisting){
    await reinitTablesNode(themes);
  }
  const resultsOpenExisting = await DB.get("event/resultsOpen");
  if(resultsOpenExisting===null){
    await DB.set("event/resultsOpen", false);
  }
}
async function reinitTablesNode(themes){
  const init = {};
  themes.forEach((t,i)=>{ init[i] = { name:t.name, quizStarted:false, score:0, answers:{} }; });
  await DB.set("tables", init);
}

/* =========================================================================
   卓バランシング・ロジック（案2の発展版：レトロゲーム・キャラの
   「性格ベクトル」に一番近い卓へ割り当て）
   ・診断の生スコアを -1〜+1 に正規化し、各ゲームテーマの性格ベクトルとの
     距離が一番近い卓を「本来の卓」とする
   ・その卓がすでに定員(capacityPerTable)に達していたら、次に近いテーマ…
     と順に空いている卓を探す（＝一番近いキャラは変わらず、僅差の
     "隠れキャラ" に回るイメージ）
   ・全卓が満員なら、その時点で一番空いている卓に入れる
   ========================================================================= */
function getAxisMaxes(questions){
  const m = { A:0, B:0, C:0 };
  (questions||[]).forEach(q=>{ if(m[q.axis]!=null) m[q.axis]++; });
  // 万一その軸の設問が0問の場合、ゼロ割りを避けるため1を最低値にする
  return { A: m.A||1, B: m.B||1, C: m.C||1 };
}
function normalizeScores(scores, axisMaxes){
  const m = axisMaxes || { A:3, B:3, C:3 };
  return { A: scores.A/m.A, B: scores.B/m.B, C: scores.C/m.C };
}
function distanceToTheme(norm, theme){
  const dx = norm.A - theme.vec.A, dy = norm.B - theme.vec.B, dz = norm.C - theme.vec.C;
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}
async function assignTable(scores, themes, capacity, axisMaxes){
  const counts = await getTableCounts(themes.length);
  const norm = normalizeScores(scores, axisMaxes);
  const ranked = themes
    .map((t,i)=>({ i, d: distanceToTheme(norm, t) }))
    .sort((a,b)=> a.d - b.d);

  for(let rank=0; rank<ranked.length; rank++){
    const idx = ranked[rank].i;
    if(counts[idx] < capacity) return { tableIndex: idx, balanced: rank>0 };
  }
  // 全卓満員：一番空いている卓へ
  let minIdx = 0;
  for(let i=1;i<themes.length;i++){ if(counts[i] < counts[minIdx]) minIdx = i; }
  return { tableIndex: minIdx, balanced:true };
}
async function getTableCounts(themeCount){
  const participants = (await DB.get("participants")) || {};
  const counts = new Array(themeCount).fill(0);
  Object.values(participants).forEach(p=>{ if(p.tableIndex!=null && p.tableIndex<themeCount) counts[p.tableIndex]++; });
  return counts;
}

let quizState = { idx:0, answers:[], questions:[] };
async function renderPersonalityQuiz(){
  const name = sessionStorage.getItem("fnk_name");
  if(!name){ location.hash="#/join"; return; }
  if(quizState.questions.length===0){
    const cfg = await DB.get("event/config");
    quizState.questions = (cfg && cfg.personality && cfg.personality.length) ? cfg.personality : DEFAULT_PERSONALITY;
  }
  drawQuizStep();
}
function drawQuizStep(){
  const total = quizState.questions.length;
  const i = quizState.idx;
  if(i>=total){ finishPersonalityQuiz(); return; }
  const q = quizState.questions[i];
  app.innerHTML = `
    <div class="eyebrow">${T('quizEyebrow')}</div>
    <div class="progress-track"><div class="progress-fill" style="width:${Math.round(i/total*100)}%"></div></div>
    <div class="qnum">Q${i+1} / ${total}</div>
    <h2 class="disp" style="margin:8px 0 20px; font-size:22px; line-height:1.5;">${esc(L(q.q, q.qEn))}</h2>
    <div class="card">
      <button class="option-btn" data-v="1">${esc(L(q.pos, q.posEn))}</button>
      <button class="option-btn" data-v="-1">${esc(L(q.neg, q.negEn))}</button>
    </div>
    ${i>0 ? `<button class="btn secondary" id="backBtn">${T('backBtn')}</button>` : ``}
  `;
  app.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      quizState.answers[i] = { axis:q.axis, value: parseInt(btn.dataset.v,10) };
      quizState.idx++;
      drawQuizStep();
    });
  });
  const backBtn = document.getElementById("backBtn");
  if(backBtn) backBtn.addEventListener("click", ()=>{ quizState.idx--; drawQuizStep(); });
}

async function finishPersonalityQuiz(){
  app.innerHTML = `<div class="center" style="padding:60px 0;"><span class="spinner"></span><p class="muted" style="margin-top:14px;">${T('decidingTable')}</p></div>`;
  const scores = { A:0, B:0, C:0 };
  quizState.answers.forEach(a=>{ scores[a.axis]+= a.value; });
  const axisMaxes = getAxisMaxes(quizState.questions);
  const name = sessionStorage.getItem("fnk_name");

  const cfg = await DB.get("event/config");
  const themes = getActiveThemes(cfg);
  const capacity = getCapacity(cfg);
  const { tableIndex, balanced } = await assignTable(scores, themes, capacity, axisMaxes);

  const participant = { name, scores, axisMaxes, tableIndex, balanced, ts: Date.now() };
  const pid = await DB.push("participants", participant);
  sessionStorage.setItem("fnk_pid", pid);
  sessionStorage.setItem("fnk_table", String(tableIndex));

  await recomputeMeister(tableIndex);

  location.hash = "#/result";
}

async function recomputeMeister(tableIndex){
  const allParticipants = (await DB.get("participants")) || {};
  const members = Object.entries(allParticipants).filter(([id,p])=> p.tableIndex===tableIndex);
  if(members.length===0) return;
  members.sort((a,b)=>{
    if(b[1].scores.C !== a[1].scores.C) return b[1].scores.C - a[1].scores.C;
    return a[1].ts - b[1].ts;
  });
  const meisterId = members[0][0];
  await DB.update(`tables/${tableIndex}`, { meisterId });
}

let boardUnsub = null;
let boardSeenIds = new Set();
let boardPrevMeister = {};
let boardPrimed = false;
async function renderBoard(){
  boardSeenIds = new Set();
  boardPrevMeister = {};
  boardPrimed = false;
  app.innerHTML = `
    <div class="header-top">
      <div class="eyebrow">${T('boardEyebrow')}</div>
      <div style="display:flex; gap:14px;">
        <a class="small-link" href="#/rules">${T('rulesLink')}</a>
        <a class="small-link" href="#/join">${T('joinLink')}</a>
      </div>
    </div>
    <h1 class="disp" style="font-size:28px; margin:6px 0 10px;">${T('boardTitle')}</h1>
    <div id="spotlightZone"></div>
    <div id="boardGrid" class="board-grid"></div>
  `;
  if(boardUnsub) boardUnsub();
  boardUnsub = DB.onValue("participants", async ()=>{
    const participants = (await DB.get("participants")) || {};
    const tables = (await DB.get("tables")) || {};
    const cfg = await DB.get("event/config");
    const themes = getActiveThemes(cfg);
    const grid = document.getElementById("boardGrid");
    if(!grid) return;

    const entries = Object.entries(participants);
    const newlyJoined = boardPrimed ? entries.filter(([id])=>!boardSeenIds.has(id)) : [];
    newlyJoined.sort((a,b)=>a[1].ts-b[1].ts);
    entries.forEach(([id])=> boardSeenIds.add(id));

    const changedMeisterTables = [];
    themes.forEach((t,i)=>{
      const mId = tables[i] && tables[i].meisterId;
      if(boardPrimed && mId && boardPrevMeister[i] && boardPrevMeister[i]!==mId){
        changedMeisterTables.push({ i, meisterId: mId });
      }
      if(mId) boardPrevMeister[i] = mId;
    });

    grid.innerHTML = themes.map((t,i)=>{
      const members = entries.filter(([id,p])=>p.tableIndex===i);
      const meisterId = tables[i] && tables[i].meisterId;
      const justJoined = newlyJoined.some(([id,p])=>p.tableIndex===i);
      const justChanged = changedMeisterTables.some(c=>c.i===i);
      return `
        <div class="lantern ${justJoined?'lantern-pulse':''} ${justChanged?'lantern-flash':''}">
          <div class="count">${members.length}${T('peopleCount')}</div>
          ${themeIconBadge(t, 26)}
          <h3>${esc(L(t.name,t.nameEn))}</h3>
          <div class="concept-en">${esc(LANG==='en' ? t.kana : t.nameEn)}</div>
          <div class="concept">${esc(L(t.descJa,t.descEn))}</div>
          <div class="members">
            ${members.length===0 ? `<span class="waiting-dot"></span> <span style="color:rgba(243,236,219,.4)">${T('noOneYet')}</span>` :
              members.sort((a,b)=>a[1].ts-b[1].ts).map(([id,p])=>`<span class="m ${id===meisterId?'meister':''}">${id===meisterId?'⛵ ':''}${esc(p.name)}</span>`).join("")}
          </div>
        </div>
      `;
    }).join("");

    const spotlightZone = document.getElementById("spotlightZone");
    if(spotlightZone){
      const cards = [];
      newlyJoined.forEach(([id,p])=>{
        const t = themes[p.tableIndex];
        if(!t) return;
        cards.push(`<div class="spotlight-card">🎉 <strong>${esc(p.name)}</strong> ${T('spotlightJoined')} <span class="pill">${esc(L(t.name,t.nameEn))}</span></div>`);
      });
      changedMeisterTables.forEach(c=>{
        const t = themes[c.i];
        const name = participants[c.meisterId] && participants[c.meisterId].name;
        if(!t || !name) return;
        cards.push(`<div class="spotlight-card meister-change">⛵ <span class="pill">${esc(L(t.name,t.nameEn))}</span> ${T('spotlightMeisterChange')} <strong>${esc(name)}</strong> ⛵</div>`);
      });
      if(cards.length){
        spotlightZone.innerHTML = cards.join("");
        void spotlightZone.offsetWidth; // restart CSS animation
        spotlightZone.classList.remove("spotlight-anim");
        void spotlightZone.offsetWidth;
        spotlightZone.classList.add("spotlight-anim");
        clearTimeout(spotlightZone._clearTimer);
        spotlightZone._clearTimer = setTimeout(()=>{ if(spotlightZone) spotlightZone.innerHTML = ""; }, 5000);
        if(changedMeisterTables.length){ playMeisterChime(); }
        else if(newlyJoined.length){ playJoinChime(); }
      }
    }
    boardPrimed = true;
  });
}

        <div class="card center">

        <div class="card">
          <p class="pill">${T('discussTime')}</p>
          <h2 class="disp" style="font-size:20px; margin:12px 0;">${esc(L(qNow.q,qNow.qEn))}</h2>

      optsHtml = `<div class="opinion-scale">${opts.map((o,idx)=>`<button class="opt" data-idx="${idx}">${esc(o)}</button>`).join("")}</div>`;
    } else {
      optsHtml = opts.map((o,idx)=>`<button class="option-btn opt" data-idx="${idx}">${esc(o)}</button>`).join("");

    const typeLabel = qNow.type==='opinion'?T('typeOpinion'):qNow.type==='member'?T('typeMember'):T('typeTrivia');

        const points = qNow.type==="opinion" ? 1 : (isCorrect?2:0);

        await DB.update(`tables/${tableIndex}`, { answers:newAnswers, score:newScore });

        toast(qNow.type==="opinion" ? T('answeredOpinion') : (isCorrect ? T('correctMsg') : T('wrongMsg')));
      });
    });
  });
  tableUnsub.push(unsub);
}

let rankingUnsub = null;
async function renderRanking(){
  app.innerHTML = `<div class="center" style="padding:60px 0;"><span class="spinner"></span></div>`;

  rankingUnsub = DB.onValue("event/resultsOpen", async (isOpen)=>{
    const cfg = await DB.get("event/config");
    const themes = getActiveThemes(cfg);
    const tables = (await DB.get("tables")) || {};

    if(!isOpen){
      app.innerHTML = `
        <div class="header-top">
          <div class="eyebrow">${T('rankingEyebrow')}</div>
          <a class="small-link" href="#/board">${T('boardLink')}</a>
        </div>
        <div class="closed-box">
          <div style="font-size:40px; margin-bottom:14px;">🔒</div>

          <p class="muted" style="margin-top:10px;">${T('rankingClosedDesc')}</p>
        </div>
      `;
      return;
    }

    const rows = themes.map((t,i)=>({ t, score:(tables[i]&&tables[i].score)||0 }))
      .sort((a,b)=> b.score - a.score);
    const medals = ["🥇","🥈","🥉"];

    app.innerHTML = `
      <div class="header-top">
        <div class="eyebrow">${T('rankingEyebrow')}</div>
        <a class="small-link" href="#/board">${T('boardLink')}</a>
      </div>
      <div class="hero-title">
        <h1 class="disp">${T('rankingTitle')}</h1>
      </div>
      ${rows.length ? `
        <div class="card pixel-frame" style="text-align:center; margin:16px 4px 20px;">
          <div class="sakura-corner">${sakuraBranchSVG(90)}</div>
          <p class="muted" style="font-size:13px;"><span class="pixel-sparkle">✨</span> ${T('rankingWinnerLabel')} <span class="pixel-sparkle">✨</span></p>
          ${themeIconBadge(rows[0].t, 44)}
          <h2 class="disp" style="font-size:30px; color:var(--gold-bright); margin:6px 0;">${esc(L(rows[0].t.name, rows[0].t.nameEn))}</h2>
          <p style="font-weight:800; font-size:20px;">${T('rankingCongrats')}</p>

}

let adminUnsub = [];
function clearAdminUnsub(){ adminUnsub.forEach(u=>u&&u()); adminUnsub=[]; }
async function renderAdmin(){
  clearAdminUnsub();
  const authed = sessionStorage.getItem("fnk_admin")==="1";
  if(!authed){
    app.innerHTML = `
      <div class="eyebrow">${T('adminLoginEyebrow')}</div>
      <h1 class="disp" style="font-size:24px; margin:6px 0 16px;">${T('adminPanelTitle')}</h1>
      <div class="card">
        <input id="pw" type="password" placeholder="${T('adminPwPlaceholder')}" style="margin-bottom:14px;">
        <button class="btn" id="loginBtn" style="width:100%;">${T('loginBtn')}</button>
      </div>
    `;
    document.getElementById("loginBtn").addEventListener("click", async ()=>{
      const pw = document.getElementById("pw").value;
      const hash = await sha256Hex(pw);
      if(ADMIN_PASSWORD_HASHES.includes(hash)){
        sessionStorage.setItem("fnk_admin","1");
        renderAdmin();
      } else {
        toast(T('wrongPw'));
      }
    });
    return;
  }

  await ensureConfig();
  let cfg = await DB.get("event/config");
  let themes = getActiveThemes(cfg);
  app.innerHTML = `
    <div class="header-top">
      <div class="eyebrow">${T('adminPanelTitle')}</div>
      <a class="small-link" href="#/board">${T('boardLink')}</a>
    </div>
    <h1 class="disp" style="font-size:26px; margin:6px 0 16px;">${T('adminPanelTitle')}</h1>

    <div class="card">
      <h3 style="margin-top:0;">${T('settingsTitle')}</h3>
      <p class="muted">${T('settingsDesc')}</p>
      <div style="display:flex; gap:12px; flex-wrap:wrap; margin:12px 0;">
        <div style="flex:1; min-width:140px;">
          <label class="muted" style="display:block; margin-bottom:6px; font-size:12.5px;">${T('tableCountLabel')}</label>
          <select id="tableCountInput">
            ${Array.from({length: MAX_TABLE_COUNT-MIN_TABLE_COUNT+1}, (_,i)=>MIN_TABLE_COUNT+i).map(n=>`<option value="${n}" ${n===clampTableCount(cfg.tableCount)?'selected':''}>${n}</option>`).join("")}
          </select>
        </div>
        <div style="flex:1; min-width:140px;">
          <label class="muted" style="display:block; margin-bottom:6px; font-size:12.5px;">${T('capacityLabel')}</label>
          <input id="capacityInput" type="text" inputmode="numeric" value="${getCapacity(cfg)}">
        </div>
      </div>
      <button class="btn" id="saveSettingsBtn">${T('saveSettingsBtn')}</button>
      <p class="muted" style="margin-top:8px; font-size:12.5px;">⚠️ ${T('settingsWarn')}</p>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">${T('step1Title')}</h3>
      <div id="tableControls" class="board-grid"></div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">${T('step2Title')}</h3>
      <p class="muted">${T('step2Desc')}</p>
      <input type="file" id="xlsxInput" accept=".xlsx" style="margin-bottom:10px;">
      <div style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn secondary" id="downloadTemplate">${T('downloadTemplateBtn')}</button>
      </div>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">${T('step3Title')}</h3>
      <table class="score-table" id="rankTable"></table>
    </div>

    <div class="card">
      <h3 style="margin-top:0;">${T('revealTitle')}</h3>
      <p class="muted">${T('revealDesc')}</p>
      <p class="muted" style="margin:10px 0;">${T('revealStatusLabel')}<strong id="revealStatusText" style="color:var(--paper);">…</strong></p>

        <button class="btn" id="revealOpenBtn">${T('revealOpenBtn')}</button>
        <button class="btn secondary" id="revealCloseBtn">${T('revealCloseBtn')}</button>
        <a class="btn secondary" href="#/ranking" target="_blank" rel="noopener">${T('revealProjectorLink')}</a>

    <div class="card">
      <h3 style="margin-top:0; color:var(--vermillion);">${T('resetTitle')}</h3>
      <p class="muted">${T('resetDesc')}</p>
      <button class="btn danger" id="resetBtn">${T('resetBtn')}</button>

  const revealUnsub = DB.onValue("event/resultsOpen", (isOpen)=>{
    const el = document.getElementById("revealStatusText");

  adminUnsub.push(revealUnsub);
  document.getElementById("revealOpenBtn").addEventListener("click", async ()=>{

    const newCount = clampTableCount(parseInt(document.getElementById("tableCountInput").value,10));
    const newCap = Math.max(1, parseInt(document.getElementById("capacityInput").value,10) || DEFAULT_CAPACITY);
    if(!confirm(T('settingsConfirm'))) return;
    await DB.update("event/config", { tableCount:newCount, capacityPerTable:newCap });

    await reinitTablesNode(GAME_THEMES.slice(0,newCount));

    el.querySelectorAll("button[data-start-i]").forEach(btn=>{

    el.querySelectorAll("button[data-reset-i]").forEach(btn=>{

      rankEl.innerHTML = `<tr><th>${T('rankHeaderRank')}</th><th>${T('rankHeaderTable')}</th><th>${T('rankHeaderScore')}</th></tr>` +
        rows.map((r,idx)=>`<tr><td>${idx+1}</td><td>${esc(r.name)}</td><td>${r.score}</td></tr>`).join("");
    }
  });
  adminUnsub.push(unsub);

  document.getElementById("resetBtn").addEventListener("click", async ()=>{
    if(!confirm(T('resetConfirm'))) return;
    await DB.remove("participants");
    await reinitTablesNode(themes);
    toast(T('resetDone'));
  });

  document.getElementById("downloadTemplate").addEventListener("click", downloadTemplateXlsx);
  document.getElementById("xlsxInput").addEventListener("change", handleXlsxUpload);
}

/* ---- Excel 連携（SheetJSは動的読み込み） ---- */
let xlsxLibPromise = null;
function loadXlsxLib(){
  if(xlsxLibPromise) return xlsxLibPromise;
  xlsxLibPromise = new Promise((resolve,reject)=>{
    const s = document.createElement("script");
    s.src = "https://unpkg.com/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = ()=>resolve(window.XLSX);
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return xlsxLibPromise;
}

async function downloadTemplateXlsx(){
  const XLSX = await loadXlsxLib();
  const cfg = (await DB.get("event/config")) || {personality:DEFAULT_PERSONALITY, tableQuiz:DEFAULT_TABLE_QUIZ, roster:[]};
  const wb = XLSX.utils.book_new();

  const pSheet = XLSX.utils.json_to_sheet((cfg.personality||[]).map(q=>({
    axis:q.axis, question:q.q, question_en:q.qEn||"", positive:q.pos, positive_en:q.posEn||"", negative:q.neg, negative_en:q.negEn||""
  })));
  XLSX.utils.book_append_sheet(wb, pSheet, "Personality");

  const tSheet = XLSX.utils.json_to_sheet((cfg.tableQuiz||[]).map(q=>({
    type:q.type, question:q.q, question_en:q.qEn||"",
    option1:q.options[0]||"", option2:q.options[1]||"", option3:q.options[2]||"", option4:q.options[3]||"",
    option1_en:(q.optionsEn&&q.optionsEn[0])||"", option2_en:(q.optionsEn&&q.optionsEn[1])||"",
    option3_en:(q.optionsEn&&q.optionsEn[2])||"", option4_en:(q.optionsEn&&q.optionsEn[3])||"",
    correctIndex: q.type==="opinion" ? "" : (q.correct!=null ? q.correct+1 : "")
  })));
  XLSX.utils.book_append_sheet(wb, tSheet, "TableQuiz");

  const rSheet = XLSX.utils.json_to_sheet((cfg.roster&&cfg.roster.length?cfg.roster:[""]).map(n=>({name:n})));
  XLSX.utils.book_append_sheet(wb, rSheet, "Roster");

  XLSX.writeFile(wb, "屋形船クイズ設定.xlsx");
}

async function handleXlsxUpload(e){
  const file = e.target.files[0];
  if(!file) return;
  const XLSX = await loadXlsxLib();
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, {type:"array"});

  const newConfig = { personality:[], tableQuiz:[], roster:[] };

  if(wb.SheetNames.includes("Personality")){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets["Personality"]);
    newConfig.personality = rows.filter(r=>r.question).map(r=>({
      axis: String(r.axis||"A").trim().toUpperCase(),
      q: String(r.question||"").trim(),
      qEn: String(r.question_en||"").trim(),
      pos: String(r.positive||"").trim(),
      posEn: String(r.positive_en||"").trim(),
      neg: String(r.negative||"").trim(),
      negEn: String(r.negative_en||"").trim(),
    }));
  }
  if(wb.SheetNames.includes("TableQuiz")){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets["TableQuiz"]);
    newConfig.tableQuiz = rows.filter(r=>r.question).map(r=>{
      const options = [r.option1,r.option2,r.option3,r.option4].filter(o=>o!==undefined && o!=="").map(String);
      const optionsEn = [r.option1_en,r.option2_en,r.option3_en,r.option4_en].filter(o=>o!==undefined && o!=="").map(String);
      const type = String(r.type||"trivia").trim();
      const obj = { type, q:String(r.question).trim(), qEn:String(r.question_en||"").trim(), options, optionsEn };
      if(type!=="opinion" && r.correctIndex){ obj.correct = parseInt(r.correctIndex,10)-1; }
      return obj;
    });
  }
  if(wb.SheetNames.includes("Roster")){
    const rows = XLSX.utils.sheet_to_json(wb.Sheets["Roster"]);
    newConfig.roster = rows.filter(r=>r.name).map(r=>String(r.name).trim());
  }

  if(newConfig.personality.length===0) newConfig.personality = DEFAULT_PERSONALITY;
  if(newConfig.tableQuiz.length===0) newConfig.tableQuiz = DEFAULT_TABLE_QUIZ;

  await DB.set("event/config", newConfig);
  toast(T('updatedQuiz'));
}
